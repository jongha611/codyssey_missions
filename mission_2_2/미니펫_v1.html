<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 미니 펫 키우기</title>
<style>
  :root {
    --bg: #fdf6ec;
    --card: #ffffff;
    --ink: #3b2f2a;
    --muted: #8a7a70;
    --track: #f1e7da;
    --food: #f29a3f;
    --mood: #e46f9c;
    --low: #d9534f;
    --btn: #4a3b33;
    --btn-ink: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 12px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 6px 24px rgba(59, 47, 42, 0.08);
    padding: 20px 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }

  /* 상단/중앙: 얼굴 + 상태 메시지 */
  .pet { text-align: center; }
  .face {
    font-size: min(26vw, 16vh, 112px);
    line-height: 1.1;
    user-select: none;
  }
  .message {
    margin-top: 6px;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.5em;
  }
  .app.over .message { color: var(--low); }

  /* 중단: 상태 수치 + 막대그래프 */
  .stats { display: flex; flex-direction: column; gap: 12px; }
  .stat-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  .stat-name { font-weight: 600; }
  .stat-value { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.1rem; }
  .stat-max { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
  .bar {
    height: 14px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 50%;
    border-radius: 999px;
    transition: width 0.3s ease, background-color 0.3s ease;
  }
  #foodFill { background: var(--food); }
  #moodFill { background: var(--mood); }
  .fill.low { background: var(--low) !important; }

  /* 하단: 버튼 */
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px 8px;
    border: none;
    border-radius: 14px;
    background: var(--btn);
    color: var(--btn-ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled {
    background: #e4dcd3;
    color: #a99c92;
    cursor: not-allowed;
  }
  button:focus-visible { outline: 3px solid var(--food); outline-offset: 2px; }
  #restartBtn { grid-column: 1 / -1; }
</style>
</head>
<body>
  <main class="app" id="app">
    <h1>나만의 미니 펫 키우기</h1>

    <section class="pet">
      <div class="face" id="face" role="img" aria-label="펫 얼굴">🙂</div>
      <p class="message" id="message" aria-live="polite">그럭저럭 괜찮아요.</p>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-head">
          <span class="stat-name">배부름</span>
          <span><span class="stat-value" id="foodValue">50</span> <span class="stat-max">/ 100</span></span>
        </div>
        <div class="bar" role="progressbar" aria-label="배부름" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="foodBar">
          <div class="fill" id="foodFill"></div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-head">
          <span class="stat-name">기분</span>
          <span><span class="stat-value" id="moodValue">50</span> <span class="stat-max">/ 100</span></span>
        </div>
        <div class="bar" role="progressbar" aria-label="기분" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" id="moodBar">
          <div class="fill" id="moodFill"></div>
        </div>
      </div>
    </section>

    <section class="buttons">
      <button type="button" id="feedBtn">밥 주기</button>
      <button type="button" id="playBtn">놀아 주기</button>
      <button type="button" id="restartBtn" disabled>다시 키우기</button>
    </section>
  </main>

<script>
(function () {
  'use strict';

  // 기획서 수치
  var MIN = 0;
  var MAX = 100;
  var START = 50;      // 시작값
  var GAIN = 20;       // 버튼 1회 증가량
  var DECAY = 5;       // 10초마다 감소량
  var TICK_MS = 10000; // 10초
  var HAPPY = 70;      // 둘 다 70 이상 → 😄
  var SAD = 30;        // 하나라도 30 미만 → 😢

  var food, mood, isOver, startedAt, ticksApplied, timerId;

  var el = {
    app: document.getElementById('app'),
    face: document.getElementById('face'),
    message: document.getElementById('message'),
    foodValue: document.getElementById('foodValue'),
    moodValue: document.getElementById('moodValue'),
    foodBar: document.getElementById('foodBar'),
    moodBar: document.getElementById('moodBar'),
    foodFill: document.getElementById('foodFill'),
    moodFill: document.getElementById('moodFill'),
    feedBtn: document.getElementById('feedBtn'),
    playBtn: document.getElementById('playBtn'),
    restartBtn: document.getElementById('restartBtn')
  };

  function clamp(v) {
    return Math.min(MAX, Math.max(MIN, v));
  }

  function getFace() {
    if (isOver) return '👋';
    if (food >= HAPPY && mood >= HAPPY) return '😄';
    if (food < SAD || mood < SAD) return '😢';
    return '🙂';
  }

  function getMessage() {
    if (isOver) return '펫이 떠났습니다...';
    if (food >= HAPPY && mood >= HAPPY) return '배도 부르고 기분도 최고예요!';
    if (food < SAD && mood < SAD) return '배고프고 심심해요...';
    if (food < SAD) return '배가 고파요...';
    if (mood < SAD) return '심심해요... 놀아 주세요.';
    return '그럭저럭 괜찮아요.';
  }

  function renderStat(value, valueEl, barEl, fillEl) {
    valueEl.textContent = value;
    barEl.setAttribute('aria-valuenow', value);
    fillEl.style.width = value + '%';
    fillEl.classList.toggle('low', value < SAD);
  }

  function render() {
    renderStat(food, el.foodValue, el.foodBar, el.foodFill);
    renderStat(mood, el.moodValue, el.moodBar, el.moodFill);

    var face = getFace();
    el.face.textContent = face;
    el.face.setAttribute('aria-label', '펫 얼굴 ' + face);
    el.message.textContent = getMessage();

    el.app.classList.toggle('over', isOver);
    el.feedBtn.disabled = isOver;
    el.playBtn.disabled = isOver;
    el.restartBtn.disabled = !isOver;
  }

  function endGame() {
    isOver = true;
    clearInterval(timerId);
    timerId = null;
  }

  // 시작 시각 기준으로 10초 경계마다 정확히 한 번씩 감소시킨다.
  // (버튼을 눌러도 타이머 주기가 밀리지 않고, 백그라운드 탭에서 타이머가 늦게 돌아도 밀린 횟수만큼 반영된다.)
  function checkTime() {
    if (isOver) return;
    var due = Math.floor((Date.now() - startedAt) / TICK_MS);
    if (due <= ticksApplied) return;
    while (ticksApplied < due && !isOver) {
      ticksApplied++;
      food = clamp(food - DECAY);
      mood = clamp(mood - DECAY);
      if (food === MIN || mood === MIN) endGame();
    }
    render();
  }

  function start() {
    food = START;
    mood = START;
    isOver = false;
    ticksApplied = 0;
    startedAt = Date.now();
    clearInterval(timerId);
    timerId = setInterval(checkTime, 250);
    render();
  }

  el.feedBtn.addEventListener('click', function () {
    if (isOver) return;
    food = clamp(food + GAIN);
    render();
  });

  el.playBtn.addEventListener('click', function () {
    if (isOver) return;
    mood = clamp(mood + GAIN);
    render();
  });

  el.restartBtn.addEventListener('click', function () {
    if (!isOver) return;
    start();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) checkTime();
  });

  start();
})();
</script>
</body>
</html>
