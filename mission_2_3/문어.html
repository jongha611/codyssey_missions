<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문어 키우기</title>
<style>
  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    color: #23324a;
    background: linear-gradient(180deg, #dff3ff 0%, #b9e2f7 100%);
  }

  .app {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border-radius: 24px;
    padding: 18px 20px 20px;
    box-shadow: 0 12px 32px rgba(35, 80, 120, 0.18);
    text-align: center;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .guide {
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: #5f7590;
    line-height: 1.35;
    word-keep: keep-all;
  }

  /* ── 문어 표시 영역 ── */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 196px;
  }

  .octopus {
    width: 180px;
    height: 180px;
    display: block;
  }

  .empty-spot {
    width: 146px;
    height: 146px;
    border: 3px dashed #9bb3c9;
    border-radius: 24px;
  }

  .gone-message {
    margin: 10px 0 0;
    font-size: 1rem;
    font-weight: 700;
    color: #5f7590;
  }

  [hidden] { display: none !important; }

  /* ── 상태 표시 영역 ── */
  .stats {
    margin: 10px 0 16px;
    display: grid;
    gap: 12px;
  }

  .stat-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 5px;
    font-size: 0.95rem;
  }

  .stat-name { font-weight: 600; }

  .stat-value {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 13px;
    background: #e7eef5;
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 50%;
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .bar-fill.hunger { background: #ffa94d; }
  .bar-fill.mood   { background: #5cb8ff; }

  /* ── 조작 버튼 영역 ── */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    font: inherit;
    font-size: 0.98rem;
    font-weight: 700;
    padding: 12px 10px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  button:active:not(:disabled) { transform: scale(0.97); }
  button:hover:not(:disabled)  { filter: brightness(0.95); }

  button:focus-visible {
    outline: 3px solid #23324a;
    outline-offset: 2px;
  }

  button:disabled {
    cursor: not-allowed;
    background: #e3e8ee !important;
    color: #a3afbd !important;
  }

  #feedBtn    { background: #ffe0bd; color: #8a4b00; }
  #playBtn    { background: #d3ecff; color: #0b5a94; }
  #restartBtn {
    grid-column: 1 / -1;
    background: #f47c7c;
    color: #ffffff;
    animation: fadeSlideIn 0.25s ease-out;
  }

  @keyframes fadeSlideIn {
    from {
      opacity: 0;
      transform: translateY(-6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── 작은 휴대폰 화면 대응 (세로 높이가 낮을 때 한 화면에 모두 들어오도록 조정) ── */
  @media (max-height: 640px) {
    body {
      padding: 6px 12px;
    }
    .app {
      padding: 12px 16px 14px;
      border-radius: 20px;
    }
    h1 {
      margin: 0 0 2px;
      font-size: 1.15rem;
    }
    .guide {
      margin: 0 0 6px;
      font-size: 0.76rem;
    }
    .stage {
      height: 142px;
    }
    .octopus {
      width: 134px;
      height: 134px;
    }
    .empty-spot {
      width: 108px;
      height: 108px;
      border-radius: 18px;
    }
    .gone-message {
      margin: 6px 0 0;
      font-size: 0.9rem;
    }
    .stats {
      margin: 6px 0 10px;
      gap: 7px;
    }
    .stat-head {
      margin-bottom: 3px;
      font-size: 0.88rem;
    }
    .bar {
      height: 10px;
    }
    .controls {
      gap: 6px;
    }
    button {
      padding: 9px 8px;
      font-size: 0.9rem;
      border-radius: 12px;
    }
  }
</style>
</head>
<body>
<main class="app">
  <h1>문어 키우기</h1>
  <p class="guide">10초마다 배부름·기분이 5씩 줄고, 하나라도 0이 되면 문어가 떠나가요.</p>

  <!-- 문어 표시 영역 -->
  <section class="stage" id="stage" role="img" aria-label="보통 문어">

    <!-- 웃는 문어: 배부름·기분 모두 70 이상 -->
    <svg class="octopus" id="octoHappy" viewBox="0 0 200 200" aria-hidden="true" hidden>
      <g stroke="#f47c7c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M66 110 C46 100 30 80 28 56 C27 46 36 42 40 50"/>
        <path d="M78 120 C62 124 48 120 38 106"/>
        <path d="M94 126 C92 142 98 156 92 170"/>
        <path d="M106 126 C108 142 102 156 108 170"/>
        <path d="M122 120 C138 124 152 120 162 106"/>
        <path d="M134 110 C154 100 170 80 172 56 C173 46 164 42 160 50"/>
      </g>
      <ellipse cx="100" cy="78" rx="56" ry="54" fill="#f47c7c"/>
      <ellipse cx="80" cy="50" rx="14" ry="9" fill="#ffffff" opacity="0.35"/>
      <g stroke="#3a2a2a" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M72 86 Q80 74 88 86"/>
        <path d="M112 86 Q120 74 128 86"/>
      </g>
      <path d="M84 98 Q100 122 116 98 Z" fill="#7a2e3a"/>
      <ellipse cx="66" cy="98" rx="8" ry="4.5" fill="#ff4f73" opacity="0.5"/>
      <ellipse cx="134" cy="98" rx="8" ry="4.5" fill="#ff4f73" opacity="0.5"/>
    </svg>

    <!-- 보통 문어: 그 외 평상시 -->
    <svg class="octopus" id="octoNormal" viewBox="0 0 200 200" aria-hidden="true">
      <g stroke="#f47c7c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M64 112 C48 130 34 150 38 166 C40 174 30 176 26 170"/>
        <path d="M78 120 C72 140 66 160 58 178"/>
        <path d="M94 124 C92 145 96 165 88 184"/>
        <path d="M106 124 C108 145 104 165 112 184"/>
        <path d="M122 120 C128 140 134 160 142 178"/>
        <path d="M136 112 C152 130 166 150 162 166 C160 174 170 176 174 170"/>
      </g>
      <ellipse cx="100" cy="78" rx="56" ry="54" fill="#f47c7c"/>
      <ellipse cx="80" cy="50" rx="14" ry="9" fill="#ffffff" opacity="0.35"/>
      <circle cx="80" cy="84" r="7" fill="#3a2a2a"/>
      <circle cx="120" cy="84" r="7" fill="#3a2a2a"/>
      <circle cx="82.5" cy="81.5" r="2.2" fill="#ffffff"/>
      <circle cx="122.5" cy="81.5" r="2.2" fill="#ffffff"/>
      <path d="M90 102 Q100 109 110 102" stroke="#3a2a2a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="66" cy="98" rx="7" ry="4" fill="#ff4f73" opacity="0.3"/>
      <ellipse cx="134" cy="98" rx="7" ry="4" fill="#ff4f73" opacity="0.3"/>
    </svg>

    <!-- 우는 문어: 배부름·기분 중 하나라도 30 미만 -->
    <svg class="octopus" id="octoSad" viewBox="0 0 200 200" aria-hidden="true" hidden>
      <g stroke="#f47c7c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M66 116 C62 140 60 160 62 186"/>
        <path d="M80 122 C78 146 78 166 80 190"/>
        <path d="M94 126 C94 150 94 170 94 192"/>
        <path d="M106 126 C106 150 106 170 106 192"/>
        <path d="M120 122 C122 146 122 166 120 190"/>
        <path d="M134 116 C138 140 140 160 138 186"/>
      </g>
      <ellipse cx="100" cy="80" rx="56" ry="53" fill="#f47c7c"/>
      <ellipse cx="80" cy="52" rx="14" ry="9" fill="#ffffff" opacity="0.3"/>
      <g stroke="#3a2a2a" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M68 78 L88 71"/>
        <path d="M112 71 L132 78"/>
        <path d="M88 110 Q100 99 112 110"/>
      </g>
      <circle cx="80" cy="88" r="6" fill="#3a2a2a"/>
      <circle cx="120" cy="88" r="6" fill="#3a2a2a"/>
      <path d="M78 97 Q72 108 78 112 Q84 108 78 97 Z" fill="#5cb8ff"/>
      <path d="M122 97 Q116 108 122 112 Q128 108 122 97 Z" fill="#5cb8ff"/>
    </svg>

    <!-- 떠난 상태: 빈 점선 테두리 -->
    <div class="empty-spot" id="octoGone" aria-hidden="true" hidden></div>

    <p class="gone-message" id="goneMessage" role="status" hidden>문어가 떠났습니다</p>
  </section>

  <!-- 상태 표시 영역 -->
  <section class="stats">
    <div class="stat">
      <div class="stat-head">
        <span class="stat-name" id="hungerLabel">배부름</span>
        <span class="stat-value" id="hungerValue">50</span>
      </div>
      <div class="bar" id="hungerBar" role="progressbar" aria-labelledby="hungerLabel"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="bar-fill hunger" id="hungerFill"></div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-head">
        <span class="stat-name" id="moodLabel">기분</span>
        <span class="stat-value" id="moodValue">50</span>
      </div>
      <div class="bar" id="moodBar" role="progressbar" aria-labelledby="moodLabel"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
        <div class="bar-fill mood" id="moodFill"></div>
      </div>
    </div>
  </section>

  <!-- 조작 버튼 영역 -->
  <section class="controls">
    <button type="button" id="feedBtn">밥 주기</button>
    <button type="button" id="playBtn">놀아 주기</button>
    <button type="button" id="restartBtn" hidden>다시 키우기</button>
  </section>
</main>

<script>
(function () {
  'use strict';

  // 기획서 수치
  var MIN = 0;
  var MAX = 100;
  var START_VALUE = 50;   // 시작값 (배부름, 기분)
  var BOOST = 20;         // 버튼 클릭 시 증가량
  var DECAY = 5;          // 주기마다 감소량
  var DECAY_MS = 10000;   // 감소 주기 10초
  var HAPPY_MIN = 70;     // 모두 70 이상 → 웃는 문어
  var SAD_BELOW = 30;     // 하나라도 30 미만 → 우는 문어

  var hunger = START_VALUE;
  var mood = START_VALUE;
  var nextDecayAt = 0;    // 다음 감소 시각 (Date.now 기준)
  var decayTimer = null;

  var el = {
    stage: document.getElementById('stage'),
    happy: document.getElementById('octoHappy'),
    normal: document.getElementById('octoNormal'),
    sad: document.getElementById('octoSad'),
    gone: document.getElementById('octoGone'),
    goneMessage: document.getElementById('goneMessage'),
    hungerValue: document.getElementById('hungerValue'),
    hungerFill: document.getElementById('hungerFill'),
    hungerBar: document.getElementById('hungerBar'),
    moodValue: document.getElementById('moodValue'),
    moodFill: document.getElementById('moodFill'),
    moodBar: document.getElementById('moodBar'),
    feedBtn: document.getElementById('feedBtn'),
    playBtn: document.getElementById('playBtn'),
    restartBtn: document.getElementById('restartBtn')
  };

  function clamp(v) {
    return Math.min(MAX, Math.max(MIN, v));
  }

  // 상태 판정: 떠남(0) → 울음(30 미만) → 웃음(모두 70 이상) → 보통
  function getState() {
    if (hunger === MIN || mood === MIN) return 'gone';
    if (hunger < SAD_BELOW || mood < SAD_BELOW) return 'sad';
    if (hunger >= HAPPY_MIN && mood >= HAPPY_MIN) return 'happy';
    return 'normal';
  }

  var LABELS = {
    happy: '웃는 문어',
    normal: '보통 문어',
    sad: '우는 문어',
    gone: '문어가 떠났습니다'
  };

  function show(node, visible) {
    if (visible) node.removeAttribute('hidden');
    else node.setAttribute('hidden', '');
  }

  function render() {
    var state = getState();
    var isGone = state === 'gone';

    // SVG 요소는 .hidden 속성이 없으므로 hidden 어트리뷰트를 직접 토글한다.
    show(el.happy, state === 'happy');
    show(el.normal, state === 'normal');
    show(el.sad, state === 'sad');
    show(el.gone, isGone);
    show(el.goneMessage, isGone);
    el.stage.setAttribute('aria-label', LABELS[state]);

    el.hungerValue.textContent = hunger;
    el.hungerFill.style.width = hunger + '%';
    el.hungerBar.setAttribute('aria-valuenow', hunger);

    el.moodValue.textContent = mood;
    el.moodFill.style.width = mood + '%';
    el.moodBar.setAttribute('aria-valuenow', mood);

    el.feedBtn.disabled = isGone;
    el.playBtn.disabled = isGone;
    show(el.restartBtn, isGone);
  }

  // 10초마다 감소. 실제 경과 시간을 기준으로 계산해서
  // 브라우저가 타이머를 늦추더라도 주기가 밀리지 않게 한다.
  function checkDecay() {
    if (getState() === 'gone') return;
    var now = Date.now();
    var changed = false;
    while (now >= nextDecayAt && getState() !== 'gone') {
      hunger = clamp(hunger - DECAY);
      mood = clamp(mood - DECAY);
      nextDecayAt += DECAY_MS;
      changed = true;
    }
    if (changed) render();
  }

  // 다음 감소 시각에 정확히 맞춰 타이머를 건다.
  function scheduleDecay() {
    clearTimeout(decayTimer);
    if (getState() === 'gone') return;
    decayTimer = setTimeout(function () {
      checkDecay();
      scheduleDecay();
    }, Math.max(0, nextDecayAt - Date.now()));
  }

  function start() {
    hunger = START_VALUE;
    mood = START_VALUE;
    nextDecayAt = Date.now() + DECAY_MS;
    render();
    scheduleDecay();
  }

  el.feedBtn.addEventListener('click', function () {
    if (getState() === 'gone') return;
    hunger = clamp(hunger + BOOST);
    render();
  });

  el.playBtn.addEventListener('click', function () {
    if (getState() === 'gone') return;
    mood = clamp(mood + BOOST);
    render();
  });

  el.restartBtn.addEventListener('click', function () {
    if (getState() !== 'gone') return;
    start();
  });

  // 화면을 다시 켰을 때 밀린 감소를 바로 반영
  document.addEventListener('visibilitychange', function () {
    checkDecay();
    scheduleDecay();
  });

  start();
})();
</script>
</body>
</html>
